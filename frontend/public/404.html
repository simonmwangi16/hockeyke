<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.png" />
    <title>Page Not Found | HockeyKE</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f9fafb;
        color: #101828;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 520px);
        text-align: center;
      }

      .logo {
        width: 150px;
        height: auto;
        margin-bottom: 36px;
      }

      .status {
        margin: 0;
        color: #465fff;
        font-size: clamp(4rem, 18vw, 8rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.06em;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 auto 28px;
        color: #667085;
        line-height: 1.6;
      }

      .home-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border: 1px solid #d0d5dd;
        border-radius: 10px;
        padding: 12px 20px;
        background: #fff;
        color: #344054;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 1px 2px rgb(16 24 40 / 5%);
      }

      .home-button:hover,
      .home-button:focus-visible {
        border-color: #465fff;
        color: #3641f5;
        outline: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101828;
          color: #f9fafb;
        }

        p {
          color: #98a2b3;
        }

        .home-button {
          border-color: #344054;
          background: #1d2939;
          color: #d0d5dd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <a href="/" aria-label="HockeyKE home">
          <img class="logo" src="/images/logo/hke-logo-horizontal.png" alt="HockeyKE" />
        </a>
        <p class="status" aria-hidden="true">404</p>
        <h1>Page not found</h1>
        <p>The page may have moved or the address may be incorrect.</p>
        <a class="home-button" href="/">Back to HockeyKE</a>
      </div>
    </main>
  </body>
</html>
